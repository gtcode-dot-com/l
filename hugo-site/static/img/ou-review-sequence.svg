<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img" aria-labelledby="title desc">
<title id="title">Review sequence for secondary reviewers</title>
<desc id="desc">Identify the claim, retain its evidence class, examine corroboration and contradiction, then record the conclusion or remaining gap.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#91a9bc" stroke-width="2"/></marker></defs>
<rect width="1000" height="370" rx="16" fill="#101824"/>
<g font-family="system-ui, sans-serif" text-anchor="middle">
<text x="500" y="55" fill="#f0f3f6" font-size="25" font-weight="700">KEEP THE RECORD REVIEWABLE</text>
<text x="500" y="88" fill="#bac9d5" font-size="17">A continuity protocol for secondary reviewers</text>
<g fill="#1b2b3b" stroke="#647e93"><rect x="30" y="140" width="205" height="100" rx="10"/><rect x="275" y="140" width="205" height="100" rx="10"/><rect x="520" y="140" width="205" height="100" rx="10"/><rect x="765" y="140" width="205" height="100" rx="10"/></g>
<g fill="#f0f3f6" font-size="18"><text x="132" y="181">Identify</text><text x="132" y="210">the claim</text><text x="377" y="181">Retain its</text><text x="377" y="210">evidence class</text><text x="622" y="169">Examine evidence,</text><text x="622" y="194">corroboration,</text><text x="622" y="219">and contradiction</text><text x="867" y="181">Record conclusion</text><text x="867" y="210">or remaining gap</text></g>
<g stroke="#91a9bc" stroke-width="2" marker-end="url(#arrow)"><path d="M240 190H268"/><path d="M485 190H513"/><path d="M730 190H758"/></g>
<text x="500" y="295" fill="#bac9d5" font-size="17">Biography, criticism, and silence are not verdicts.</text>
<text x="500" y="323" fill="#bac9d5" font-size="17">Explain the evidence and the basis for the conclusion.</text>
</g></svg>
